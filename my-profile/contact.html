<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Yonatan Alemayehu</title>
  </head>
  <body>
    <h1>Contact Me</h1>

    <form action="/submit" method="post">
      <label for="name">Full name</label>
      <input type="text" id="name" name="name" required minlength="2">

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>

      <label for="phone">Phone (optional)</label>
      <input type="text" id="phone" name="phone" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" title="Use the format 507-389-1000">

      <label for="msg">Message</label>
      <textarea id="msg" name="msg" rows="4" required></textarea>

      <button type="submit">Send</button>
    </form>

    <a href="bio.html">Back to my bio</a>
  </body>
</html>
