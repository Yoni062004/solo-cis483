<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS in Action — Class Project</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Jordan Lee</h1>
    <nav>
      <ul>
        <li><a href="#about">About</a></li>
        <li><a href="#skills">Skills</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="about" class="card">
      <h2>About</h2>
      <p>This is a plain HTML page. Every visual change you see came from <strong>style.css</strong> — not one HTML tag was touched.</p>
    </section>

    <section id="skills">
      <h2>Skills</h2>
      <ul class="skills-list">
        <li>HTML</li>
        <li>CSS</li>
        <li>Flexbox</li>
        <li>Git</li>
      </ul>
    </section>

    <section id="contact" class="card">
      <h2>Contact</h2>
      <form>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>
        <button type="submit">Send</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Jordan Lee</p>
  </footer>

</body>
</html>
